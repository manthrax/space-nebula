<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Generator - 3D Space Vista</title>
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #333333;
            --bg: #000000;
            --text: #ffffff;
            --panel: rgba(10, 10, 15, 0.4);
            --border: rgba(255, 255, 255, 0.15);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
        }

        canvas#viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            width: 240px;
            pointer-events: auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            opacity: 0.9;
        }

        .description {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            font-weight: 600;
        }

        .control-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .control-row input {
            flex: 1;
        }

        .btn-small {
            padding: 0.4rem;
            min-width: 32px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.4rem;
            color: #fff;
            outline: none;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        input:focus,
        select:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .status {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: #666;
            text-align: right;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div style="color: #666; font-size: 0.9rem;">Initializing Cosmic Weaver...</div>
    </div>

    <canvas id="viewer"></canvas>

    <div class="ui-overlay">
        <div class="panel">
            <h1>Nebula Generator</h1>
            <div class="description">
                Procedural 3D space generator. Original algorithm by <a href="https://github.com/wwwtyro"
                    style="color: #888;">Joshua Hook (@wwwtyro)</a>. Refactored and modernized by <a href="https://github.com/manthrax/space-nebula" style="color: #888;">@manthrax</a>.
            </div>

            <div class="control-group">
                <div class="control">
                    <label>Seed</label>
                    <div class="control-row">
                        <input type="text" id="seed" value="nebula-prime">
                        <button id="randomSeedBtn" class="btn-small" title="Randomize Seed">🎲</button>
                    </div>
                </div>

                <div class="control">
                    <label>Resolution</label>
                    <select id="resolution">
                        <option value="512">512px</option>
                        <option value="1024" selected>1024px</option>
                        <option value="2048">2048px (Slow)</option>
                    </select>
                </div>

                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="nebulae" checked>
                    <label for="nebulae">Nebulae</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="stars" checked>
                    <label for="stars">Bright Stars</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="pointStars" checked>
                    <label for="pointStars">Dust Stars</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="sun" checked>
                    <label for="sun">Main Sun</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="showTestObj">
                    <label for="showTestObj">Test Object</label>
                </div>

                <button id="generateBtn">Generate Vista</button>
                
                <div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <label style="font-size: 0.7rem; color: #888; margin-bottom: 0.5rem; display: block;">Export Current Vista</label>
                    <div class="control-row">
                        <button id="exportJpgBtn" style="flex: 1;">JPG (360°)</button>
                        <button id="exportExrBtn" style="flex: 1;">HDR (EXR)</button>
                    </div>
                </div>

                <div id="status" class="status">Ready</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
        import NebulaGenerator from './NebulaGenerator.js';
        import Exporter from './Exporter.js';

        // UI Elements
        const seedInput = document.getElementById('seed');
        const resSelect = document.getElementById('resolution');
        const generateBtn = document.getElementById('generateBtn');
        const exportJpgBtn = document.getElementById('exportJpgBtn');
        const exportExrBtn = document.getElementById('exportExrBtn');
        const statusText = document.getElementById('status');
        const loadingOverlay = document.getElementById('loading');

        // Three.js Setup
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('viewer'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        // Generator (Now sharing the main renderer's context)
        const generator = new NebulaGenerator(renderer);
        const exporter = new Exporter(renderer);
        let currentCubeTexture = null;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1, 3); // Positioned to see the test object

        // --- PBR Test Objects ---
        const testGroup = new THREE.Group();
        testGroup.visible = false;
        scene.add(testGroup);

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 64, 64),
            new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 1.0,
                roughness: 0.05,
                envMapIntensity: 1.5
            })
        );
        sphere.position.y = 0.5;
        testGroup.add(sphere);

        const monolith = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 3.14, 0.05),
            new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 1.0,
                roughness: 0.001,
                envMapIntensity: 2.0
            })
        );
        monolith.position.set(0, .5, -1);
        testGroup.add(monolith);

        // ------------------------

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true; // Enabled for testing
        controls.enablePan = true;
        controls.rotateSpeed = 0.5; // Invert to feel like you're looking around
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        /*
        // --- Diagnostic Test Objects ---
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: 0x00ff00 })
        );
        cube.position.set(-2, 0, -5);
        scene.add(cube);
    
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x0000ff })
        );
        sphere.position.set(2, 0, -5);
        scene.add(sphere);
    
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
    
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        // -------------------------------
        */

        async function doGenerate() {
            statusText.innerText = "Generating...";
            generateBtn.disabled = true;

            // Let UI update
            await new Promise(r => setTimeout(r, 100));

            const startTime = performance.now();

            try {
                currentCubeTexture = generator.generate(seedInput.value, {
                    resolution: parseInt(resSelect.value),
                    nebulae: document.getElementById('nebulae').checked,
                    stars: document.getElementById('stars').checked,
                    pointStars: document.getElementById('pointStars').checked,
                    sun: document.getElementById('sun').checked
                });

                scene.background = currentCubeTexture;
                scene.environment = currentCubeTexture;
                console.log("Applied cubeTexture to background and environment");

                const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                statusText.innerText = `Generated in ${duration}s`;
            } catch (e) {
                console.error(e);
                statusText.innerText = "Generation failed";
            }

            generateBtn.disabled = false;
            loadingOverlay.classList.add('hidden');
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        generateBtn.addEventListener('click', doGenerate);

        async function handleExport(format) {
            if (!currentCubeTexture) return;
            statusText.innerText = `Exporting ${format.toUpperCase()}...`;
            try {
                await exporter.exportEquirect(currentCubeTexture, 4096, format);
                statusText.innerText = "Export complete";
            } catch (e) {
                console.error(e);
                statusText.innerText = "Export failed";
            }
        }

        exportJpgBtn.addEventListener('click', () => handleExport('jpg'));
        exportExrBtn.addEventListener('click', () => handleExport('exr'));

        // Click on randomize button to generate a new seed
        document.getElementById('randomSeedBtn').addEventListener('click', () => {
            const randomSeed = Math.random().toString(36).substring(2, 7) + '-' + Math.random().toString(36).substring(2, 7);
            seedInput.value = randomSeed;
            doGenerate();
        });

        // Auto-generate on parameter changes
        ['resolution', 'nebulae', 'stars', 'pointStars', 'sun'].forEach(id => {
            document.getElementById(id).addEventListener('change', doGenerate);
        });

        // Also regenerate if seed is manually changed
        seedInput.addEventListener('change', doGenerate);

        // Toggle test object
        document.getElementById('showTestObj').addEventListener('change', (e) => {
            testGroup.visible = e.target.checked;
            if (e.target.checked) {
                controls.autoRotate = false;
                camera.position.set(2, 1, 3);
                camera.lookAt(0, 0.5, 0);
            } else {
                camera.position.set(0, 0, 0.1);
                camera.lookAt(0, 0, 0);
                controls.autoRotate = true;
            }
            controls.update();
        });

        // Initial generation
        doGenerate();
        animate();

    </script>
</body>

</html>
