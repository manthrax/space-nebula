<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebularity Generator - 3D Space Vista</title>
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #333333;
            --bg: #000000;
            --text: #ffffff;
            --panel: rgba(10, 10, 15, 0.4);
            --border: rgba(255, 255, 255, 0.15);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
        }

        canvas#viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            width: 240px;
            pointer-events: auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            opacity: 0.9;
        }

        .description {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            font-weight: 600;
        }

        .control-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .control-row input {
            flex: 1;
        }

        .btn-small {
            padding: 0.4rem;
            min-width: 32px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-small.tagged {
            background: rgba(255, 60, 60, 0.3);
            border-color: rgba(255, 60, 60, 0.4);
            color: #ff8888;
        }

        .btn-small.tagged:hover {
            background: rgba(255, 60, 60, 0.5);
        }

        input[type="text"],
        input[type="number"],
        select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.4rem;
            color: #fff;
            outline: none;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        input:focus,
        select:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .status {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: #666;
            text-align: right;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-BHvioKta.js"></script>
</head>

<body>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div style="color: #666; font-size: 0.9rem;">Initializing Cosmic Weaver...</div>
    </div>

    <canvas id="viewer"></canvas>

    <div class="ui-overlay">
        <div class="panel">
            <h1>Nebularity</h1>
            <div class="description">
                Procedural 3D space generator. Original algorithm by <a href="https://github.com/wwwtyro"
                    style="color: #888;">Joshua Hook (@wwwtyro)</a>. Refactored and modernized by <a
                    href="https://github.com/manthrax/space-nebula" style="color: #888;">@manthrax</a>.
            </div>

            <div class="control-group">
                <div class="control">
                    <label>Seed</label>
                    <div class="control-row">
                        <input type="text" id="seed" value="nebularity6">
                        <button id="addSeedBtn" class="btn-small" title="Save Seed to List">+</button>
                        <button id="randomSeedBtn" class="btn-small" title="Randomize Seed (Space)">🎲</button>
                    </div>
                </div>

                <div class="control">
                    <label>Resolution</label>
                    <select id="resolution">
                        <option value="512">512px</option>
                        <option value="1024" selected>1024px</option>
                        <option value="2048">2048px (Slow)</option>
                    </select>
                </div>

                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="nebulae" checked>
                    <label for="nebulae">Nebulae</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="stars" checked>
                    <label for="stars">Bright Stars</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="pointStars" checked>
                    <label for="pointStars">Dust Stars</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="sun" checked>
                    <label for="sun">Main Sun</label>
                </div>
                <div class="control" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="showTestObj">
                    <label for="showTestObj">Test Object</label>
                </div>

                <button id="generateBtn">Generate Vista</button>

                <div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <label style="font-size: 0.7rem; color: #888; margin-bottom: 0.5rem; display: block;">Export Current
                        Vista</label>
                    <div class="control-row">
                        <button id="exportJpgBtn" style="flex: 1;">JPG (360°)</button>
                        <button id="exportExrBtn" style="flex: 1;">HDR (EXR)</button>
                    </div>
                    <button id="exportSeedsBtn" style="width: 100%; margin-top: 0.5rem; background: rgba(255,255,255,0.05);">Export Seed List (JSON)</button>
                </div>

                <div id="status" class="status">Ready</div>
            </div>
        </div>
    </div>

</body>

</html>
