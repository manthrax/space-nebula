<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gamelet</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            transition: opacity 1.5s ease-out;
            pointer-events: all;
            text-align: center;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: #88ccff;
            text-shadow: 0 0 20px rgba(136, 204, 255, 0.5);
            letter-spacing: 15px;
        }

        p {
            font-size: 1.2rem;
            color: #88ccff;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .start-btn {
            margin-top: 4rem;
            padding: 1.2rem 3rem;
            background: transparent;
            border: 1px solid #88ccff;
            color: #88ccff;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .start-btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.6);
        }

        #map-sidebar {
            position: fixed;
            right: 20px;
            top: 100px;
            width: 260px;
            background: rgba(0, 20, 40, 0.85);
            border: 1px solid #00ffaa;
            padding: 20px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            pointer-events: auto;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }

        #map-sidebar.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <h1>NEBULA DRIFTER</h1>
        <p>DEEP SPACE EXPLORATION INTERFACE / v4.2</p>
        <button class="start-btn" id="startBtn">Initiate Sequence</button>
    </div>
    <div id="map-sidebar" class="hidden"></div>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader';
        import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader';
        import Nebularity from '../src/Nebularity.js';
        import FlightController from './src/FlightController.js';
        import HUD from './src/HUD.js';
        import PlanetGenerator from '../src/PlanetGenerator.js';
        import PersistenceManager from './src/PersistenceManager.js';
        import NameGenerator from './src/NameGenerator.js';
        import ShieldSystem from './src/ShieldSystem.js';
        import Exporter from '../src/Exporter.js';
        import UniverseManager from './src/UniverseManager.js';
        import StarMap from './src/StarMap.js';

        // --- Setup ---
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            //logarithmicDepthBuffer: true 
            reverseDepthBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.autoClear = false; // Allow manual clearing for overlays
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000000);

        const timer = new THREE.Timer();
        const thrusterMaterials = [];
        let flightController = null;
        let isStarted = false;

        // --- Universe & Map ---
        const universe = new UniverseManager("nebula-voyager-v1");
        const starMap = new StarMap(renderer, universe);
        let currentLatticePos = { ix: 0, iy: 0, iz: 0 };
        let currentSector = universe.getSector(0, 0, 0);

        starMap.onSectorSelected = (sector, path) => {
            const sidebar = document.getElementById('map-sidebar');
            const name = nameGen.getName(sector.seed, 'sector');
            sidebar.innerHTML = `
                <div style="font-size: 1.2rem; border-bottom: 1px solid #00ffaa; margin-bottom: 10px;">${name}</div>
                <div>GRID: [${sector.coords.ix}, ${sector.coords.iy}, ${sector.coords.iz}]</div>
                <div style="margin-top: 10px; color: #88ccff;">STATUS: ${universe.visitedSectors.has(sector.id) ? 'EXPLORED' : 'UNMAPPED'}</div>
                <div style="margin-top: 20px;">PATH STEPS: ${path.length > 0 ? path.length - 1 : 'N/A'}</div>
                ${path.length > 0 ? '<div style="color: #00ffaa; margin-top: 10px;">> COURSE PLOTTED</div>' : ''}
            `;
            sidebar.classList.remove('hidden');
        };

        // --- HUD & Generators ---
        const hud = new HUD(scene, camera);
        const planetGen = new PlanetGenerator(renderer);
        const persistence = new PersistenceManager();
        const nameGen = new NameGenerator();
        let shieldSystem = null;
        let currentPlanet = null;
        let lastSaveTime = 0;

        // --- Nebularity Background ---
        const nebularity = new Nebularity({ THREE, renderer, scene });
        let currentSeed = "game-init-seed";
        nebularity.morph(currentSeed, { resolution: 1024 });

        // --- Ship Loading ---
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        loader.load('ship.glb', async (gltf) => {
            const ship = gltf.scene;
            ship.scale.multiplyScalar(.3)
            ship.updateMatrixWorld(true)
            ship.traverse((child) => {
                if (child.isMesh) {
                    // PBR Shiny Metal
                    child.material.metalness = 1.0;
                    child.material.roughness = 0.1;
                    child.material.envMapIntensity = 2.5;
                }

                if (child.name.startsWith("thruster")) {
                    const strength = (child.userData.strength && child.userData.strength.value !== undefined)
                        ? child.userData.strength.value
                        : 1.0;

                    child.material = new THREE.ShaderMaterial({
                        uniforms: {
                            uTime: { value: 0 },
                            uStrength: { value: strength },
                            uColor: { value: new THREE.Color(0x3366ff) }
                        },
                        vertexShader: `
                            uniform float uTime;
                            uniform float uStrength;
                            varying vec2 vUv;
                            void main() {
                                vUv = uv;
                                vec3 pos = position;
                                float noise = sin(uTime * 50.0 + vUv.x * 10.0) * 0.1 * uStrength;
                                if (pos.y > 0.0) pos.y *= (uStrength + noise) * 20.;
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                            }
                        `,
                        fragmentShader: `
                            varying vec2 vUv;
                            uniform vec3 uColor;
                            void main() {
                                float alpha = pow(1.0 - vUv.y, 2.0);
                                gl_FragColor = vec4(uColor * 5.0, alpha);
                            }
                        `,
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                    });
                    thrusterMaterials.push(child.material);
                    child.material.userData.baseStrength = strength;
                }
            });

            // Initial position before controller takes over
            ship.position.set(0, 0, 0);
            scene.add(ship);
            flightController = new FlightController(ship, camera);
            shieldSystem = new ShieldSystem(ship, scene);

            // --- Persistence Restore ---
            await persistence.init();
            const saved = await persistence.loadState();
            if (saved) {
                currentLatticePos = saved.latticePos || { ix: 0, iy: 0, iz: 0 };
                currentSector = universe.getSector(currentLatticePos.ix, currentLatticePos.iy, currentLatticePos.iz);
                
                // Restore visited sectors
                if (saved.visitedSectors) {
                    saved.visitedSectors.forEach(id => universe.visitedSectors.add(id));
                }
                universe.visitedSectors.add(currentSector.id);

                // Restore Ship State
                if (saved.position) flightController.ship.position.copy(saved.position);
                if (saved.quaternion) flightController.ship.quaternion.copy(saved.quaternion);
                if (saved.velocity) flightController.velocity.copy(saved.velocity);
                if (saved.rotationVelocity) flightController.rotationVelocity.copy(saved.rotationVelocity);
                if (saved.throttle) flightController.throttle.copy(saved.throttle);

                // Restore Pathfinding
                if (saved.plannedPath && saved.plannedPath.length > 0) {
                    starMap.plannedPath = saved.plannedPath.map(coords => universe.getSector(coords.ix, coords.iy, coords.iz));
                    if (saved.selectedSectorId) {
                        starMap.selectedSector = universe.sectors.get(saved.selectedSectorId);
                    }
                    // Update Sidebar if path exists
                    starMap.onSectorSelected(starMap.selectedSector, starMap.plannedPath);
                }

                nebularity.morph(currentSector.seed, { resolution: 1024 });
                spawnPlanet(currentSector);

                const sectorName = nameGen.getName(currentSector.seed, 'sector');
                hud.addMessage(`SYSTEMS RESTORED. CURRENT SECTOR: ${sectorName}`);
            } else {
                nebularity.morph(currentSector.seed, { resolution: 1024 });
                spawnPlanet(currentSector);
            }
        });

        // --- Warp Point Class ---
        class WarpPoint {
            constructor(scene, position, originSeed, targetSeed, label, targetLatticePos) {
                this.position = position.clone();
                this.targetSeed = targetSeed;
                this.targetLatticePos = targetLatticePos;
                this.label = label;
                this.mesh = null;
                
                const colorA = this._seedToColor(originSeed);
                const colorB = this._seedToColor(targetSeed);
                const mixedColor = colorA.lerp(colorB, 0.5);

                const material = new THREE.ShaderMaterial({
                    transparent: true,
                    uniforms: { 
                        uTime: { value: 0 }, 
                        uColor: { value: mixedColor },
                        uIsCourseTarget: { value: 0.0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform vec3 uColor;
                        uniform float uIsCourseTarget;
                        varying vec2 vUv;
                        void main() {
                            vec2 uv = vUv - 0.5;
                            float dist = length(uv);
                            if (dist > 0.5) discard;
                            
                            vec3 col = mix(uColor, vec3(0.1, 1.0, 0.5), uIsCourseTarget);

                            float ring = sin(dist * 30.0 - uTime * 8.0);
                            ring = smoothstep(0.4, 0.5, ring) * (0.5 - dist);
                            float swirl = atan(uv.y, uv.x) + dist * 15.0 - uTime * 4.0;
                            float spiral = sin(swirl * 4.0);
                            spiral = smoothstep(0.5, 1.0, spiral) * (0.5 - dist);
                            float core = smoothstep(0.1, 0.0, dist);
                            gl_FragColor = vec4(col * (ring * 2.0 + spiral + core), (ring + spiral + core) * 0.9);
                        }
                    `
                });

                this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), material);
                this.mesh.position.copy(this.position);
                this.isCourseTarget = false;
                scene.add(this.mesh);
            }

            _seedToColor(seed) {
                let hash = 0;
                for (let i = 0; i < seed.length; i++) hash = (hash << 5) - hash + seed.charCodeAt(i);
                const h = Math.abs(hash % 360) / 360;
                return new THREE.Color().setHSL(h, 0.7, 0.6);
            }

            update(time, camera) {
                this.mesh.material.uniforms.uTime.value = time;
                this.mesh.material.uniforms.uIsCourseTarget.value = this.isCourseTarget ? 1.0 : 0.0;
                this.mesh.lookAt(camera.position);
            }
        }

        let warpPoints = [];

        async function spawnPlanet(sector) {
            const seed = sector.seed;
            const rng = nameGen._getRNG(seed);
            
            // Clean up previous
            if (currentPlanet) {
                scene.remove(currentPlanet);
                currentPlanet.geometry.dispose();
                currentPlanet.material.dispose();
            }
            warpPoints.forEach(wp => scene.remove(wp.mesh));
            warpPoints = [];
            hud.pois = [];

            // 1. Generate Planet
            if (rng() < 0.4) {
                const texture = await planetGen.generate({ seed: seed, resolution: 1024, scale: 1.0, octaves: 6 });
                const radius = 500 + rng() * 1000;
                const geo = new THREE.SphereGeometry(radius, 64, 64);
                const mat = new THREE.MeshStandardMaterial({ map: texture, metalness: 0, roughness: 0.8 });
                currentPlanet = new THREE.Mesh(geo, mat);
                const dist = 5000 + rng() * 5000;
                const angle = rng() * Math.PI * 2;
                currentPlanet.position.set(Math.cos(angle) * dist, (rng() - 0.5) * 2000, Math.sin(angle) * dist);
                scene.add(currentPlanet);
                const planetName = nameGen.getName(seed, 'planet');
                hud.addTargetPOI(currentPlanet.position, planetName);
                hud.addMessage(`LONG-RANGE SCANNERS DETECTED: ${planetName}`);
            } else {
                currentPlanet = null;
            }

            // 2. Spawn Warp Points (Gateways to Neighbors)
            const neighbors = universe.getNeighbors(sector);
            neighbors.forEach((neighbor, i) => {
                const dist = 3000 + i * 1000;
                const angle = (i / neighbors.length) * Math.PI * 2;
                const wpPos = new THREE.Vector3(Math.cos(angle) * dist, (rng() - 0.5) * 1000, Math.sin(angle) * dist);
                const wpName = `WARP NODE: ${nameGen.getName(neighbor.seed, 'sector')}`;
                const wp = new WarpPoint(scene, wpPos, seed, neighbor.seed, wpName, neighbor.coords);
                warpPoints.push(wp);
                hud.addTargetPOI(wpPos, wpName);
            });
        }

        function animate(time) {
            requestAnimationFrame(animate);
            timer.update(time);
            const delta = timer.getDelta();
            const elapsed = timer.getElapsed();

            nebularity.update(delta);

            if (flightController && isStarted) {
                // Update proximity data
                let nearestPlanetDist = 1000000;
                let atmosphereThreshold = 0;
                let nearestPlanetDir = null;

                if (currentPlanet) {
                    const radius = currentPlanet.geometry.parameters.radius;
                    const distToCenter = flightController.ship.position.distanceTo(currentPlanet.position);
                    atmosphereThreshold = radius * 0.15;
                    nearestPlanetDist = distToCenter - radius;
                    nearestPlanetDir = currentPlanet.position.clone().sub(flightController.ship.position).normalize();

                    // Hard Floor
                    const minAllowedDist = radius * 1.1;
                    if (distToCenter < minAllowedDist) {
                        const pushDir = flightController.ship.position.clone().sub(currentPlanet.position).normalize();
                        flightController.ship.position.copy(currentPlanet.position).addScaledVector(pushDir, minAllowedDist);
                        const velocityDot = flightController.velocity.dot(pushDir);
                        if (velocityDot < 0) {
                            flightController.velocity.addScaledVector(pushDir, -velocityDot * 1.5);
                            hud.addMessage("WARNING: ATMOSPHERIC DENSITY CRITICAL.");
                        }
                    }
                }

                if (!starMap.visible) {
                    flightController.update(delta, {
                        nearestPlanetDist,
                        atmosphereThreshold,
                        nearestPlanetDir
                    });
                }

                // Update Warp Points
                warpPoints.forEach(wp => {
                    wp.isCourseTarget = false;
                    if (starMap.plannedPath.length > 1) {
                        const nextSector = starMap.plannedPath[1];
                        if (wp.targetLatticePos.ix === nextSector.coords.ix &&
                            wp.targetLatticePos.iy === nextSector.coords.iy &&
                            wp.targetLatticePos.iz === nextSector.coords.iz) {
                            wp.isCourseTarget = true;
                        }
                    }
                    wp.mesh.userData.isCourseTarget = wp.isCourseTarget;
                    if (wp.isCourseTarget && flightController.autopilot) {
                        flightController.autopilotTarget = wp.position;
                    }

                    wp.update(elapsed, camera);
                    if (flightController.ship.position.distanceTo(wp.position) < 150) {
                        currentLatticePos = wp.targetLatticePos;
                        currentSector = universe.getSector(currentLatticePos.ix, currentLatticePos.iy, currentLatticePos.iz);
                        universe.visitedSectors.add(currentSector.id);

                        // Update path (remove the step we just took)
                        if (starMap.plannedPath.length > 1) {
                            starMap.plannedPath.shift();
                            
                            // Update UI or hide if finished
                            if (starMap.plannedPath.length <= 1) {
                                starMap.selectedSector = null;
                                starMap.plannedPath = [];
                                flightController.autopilot = false;
                                flightController.autopilotTarget = null;
                                document.getElementById('map-sidebar').classList.add('hidden');
                                hud.addMessage("COURSE COMPLETE. DESTINATION REACHED.");
                            } else {
                                // Trigger UI update with remaining path
                                starMap.onSectorSelected(starMap.selectedSector, starMap.plannedPath);
                            }
                        }

                        nebularity.morph(currentSector.seed, { duration: 2.0 });
                        flightController.triggerWarp(2.0);
                        hud.addMessage(`TRANSITIONING TO NODE: ${currentSector.id.toUpperCase()}...`);
                        setTimeout(() => spawnPlanet(currentSector), 1000);
                        // Jump forward slightly to avoid double trigger
                        flightController.ship.position.addScaledVector(flightController.velocity, 2.0);
                    }
                });

                const targets = [];
                if (currentPlanet) targets.push(currentPlanet);
                warpPoints.forEach(wp => targets.push(wp.mesh));

                const sectorName = nameGen.getName(currentSector.seed, 'sector');

                hud.update(delta, {
                    thrust: flightController.thrustInput,
                    speed: flightController.velocity.length(),
                    charge: flightController.charge,
                    seed: sectorName,
                    position: flightController.ship.position,
                    ship: flightController.ship,
                    targets: targets
                });

                if (shieldSystem) {
                    shieldSystem.update(delta, elapsed, {
                        thrust: flightController.thrustInput,
                        speed: flightController.velocity.length(),
                        nearestPlanetDist: nearestPlanetDist - (currentPlanet ? currentPlanet.geometry.parameters.radius * 0.1 : 0),
                        atmosphereThreshold: atmosphereThreshold,
                        nearestPlanetPos: currentPlanet ? currentPlanet.position : null,
                        planetRadius: currentPlanet ? currentPlanet.geometry.parameters.radius : 0
                    });
                }

                // Thruster FX
                const thrustVal = flightController.thrustInput;
                thrusterMaterials.forEach(m => {
                    m.uniforms.uTime.value = elapsed;
                    m.uniforms.uStrength.value = m.userData.baseStrength * (0.2 + thrustVal * 0.8);
                });

                // Persistence
                if (time - lastSaveTime > 2000) {
                    lastSaveTime = time;
                    persistence.saveState({
                        latticePos: currentLatticePos,
                        position: { x: flightController.ship.position.x, y: flightController.ship.position.y, z: flightController.ship.position.z },
                        quaternion: { x: flightController.ship.quaternion.x, y: flightController.ship.quaternion.y, z: flightController.ship.quaternion.z, w: flightController.ship.quaternion.w },
                        velocity: { x: flightController.velocity.x, y: flightController.velocity.y, z: flightController.velocity.z },
                        rotationVelocity: { x: flightController.rotationVelocity.x, y: flightController.rotationVelocity.y, z: flightController.rotationVelocity.z },
                        throttle: { x: flightController.throttle.x, y: flightController.throttle.y, z: flightController.throttle.z },
                        plannedPath: starMap.plannedPath.map(s => s.coords),
                        selectedSectorId: starMap.selectedSector ? starMap.selectedSector.id : null,
                        visitedSectors: Array.from(universe.visitedSectors)
                    });
                }
            }

            renderer.render(scene, camera);
            if (starMap.visible) {
                starMap.update(delta);
                starMap.render(renderer);
            }
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            isStarted = true;
            document.getElementById('overlay').classList.add('hidden');
            hud.show();
            hud.addMessage("SYSTEMS ONLINE. NAVIGATION ACTIVE.");
        });

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            
            if (starMap && starMap.camera) {
                starMap.camera.aspect = w / h;
                starMap.camera.updateProjectionMatrix();
            }
            
            renderer.setSize(w, h);
            if (hud) hud.resize(w, h);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyU') { // Universal Jump (Randomize Lattice)
                currentLatticePos = {
                    ix: Math.floor((Math.random() - 0.5) * 100),
                    iy: Math.floor((Math.random() - 0.5) * 100),
                    iz: Math.floor((Math.random() - 0.5) * 100)
                };
                currentSector = universe.getSector(currentLatticePos.ix, currentLatticePos.iy, currentLatticePos.iz);
                universe.visitedSectors.add(currentSector.id);
                
                nebularity.morph(currentSector.seed, { duration: 2.0 });
                if (flightController) flightController.triggerWarp(2.0);
                hud.addMessage(`INITIATING BLIND JUMP...`);
                setTimeout(() => spawnPlanet(currentSector), 1000);
            }

            if (e.code === 'Tab') {
                e.preventDefault();
                if (starMap.visible) starMap.hide();
                else starMap.show(currentSector);
            }

            if (e.code === 'KeyK') { // Autopilot Toggle
                if (flightController) {
                    if (starMap.plannedPath.length > 1) {
                        const targetWP = warpPoints.find(wp => wp.isCourseTarget);
                        if (targetWP) {
                            flightController.autopilot = !flightController.autopilot;
                            flightController.autopilotTarget = targetWP.position;
                            hud.addMessage(flightController.autopilot ? "AUTOPILOT ENGAGED. LOCKING COURSE." : "AUTOPILOT OFFLINE.");
                        } else {
                            hud.addMessage("AUTOPILOT ERROR: NO TARGET ACQUIRED.");
                        }
                    } else {
                        hud.addMessage("AUTOPILOT ERROR: NO COURSE PLOTTED.");
                    }
                }
            }
        });

        animate();
    </script>
</body>

</html>
